<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="student, web developer, tinkerer">
  <defs>
    <clipPath id="type">
      <rect x="0" y="0" width="0" height="84">
        <animate attributeName="width"
          values="0;480;480;0;480;480;0;480;480"
          keyTimes="0;0.1778;0.3333;0.3334;0.5111;0.6667;0.6668;0.8444;1"
          dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="900" height="84" fill="#070a14"/>
  <rect width="900" height="84" fill="none" stroke="#13203c" stroke-width="1"/>
  <line x1="40" y1="58" x2="860" y2="58" stroke="#101a30" stroke-width="1"/>

  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="28" font-weight="600">
    <text x="40" y="50" fill="#7c3aed">&gt;</text>

    <g fill="#cfe8ff">
      <text x="72" y="50" clip-path="url(#type)">student · yogyakarta</text>
      <rect x="448" y="24" width="11" height="30" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.333;0.334;1" dur="9s" repeatCount="indefinite"/>
    </g>

    <g fill="#cfe8ff">
      <text x="72" y="50" clip-path="url(#type)">web dev · c++ · python</text>
      <rect x="465" y="24" width="11" height="30" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.334;0.666;0.667;1" dur="9s" repeatCount="indefinite"/>
    </g>

    <g fill="#cfe8ff">
      <text x="72" y="50" clip-path="url(#type)">building in typescript</text>
      <rect x="465" y="24" width="11" height="30" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.666;0.667;1" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
