<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="tech stack">
  <defs>
    <filter id="cg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="150" fill="#070a14"/>
  <text x="30" y="30" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" letter-spacing="3" fill="#4b5d82">// what i reach for</text>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-weight="700" font-size="22" text-anchor="middle">
    <g>
      <rect x="30" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#ff7a59" stroke-width="1.5" filter="url(#cg)"/>
      <text x="96" y="82" fill="#ffd9c9">HTML</text>
      <rect x="32" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="32;148;32" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="174" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#38bdf8" stroke-width="1.5" filter="url(#cg)"/>
      <text x="240" y="82" fill="#d9f3ff">CSS</text>
      <rect x="176" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="176;292;176" dur="3.4s" begin="-0.6s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.6s" begin="-0.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="318" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#f7df1e" stroke-width="1.5" filter="url(#cg)"/>
      <text x="384" y="82" fill="#fff6c2">JS</text>
      <rect x="320" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="320;436;320" dur="2.8s" begin="-1.2s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.8s" begin="-1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="462" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#4ea1ff" stroke-width="1.5" filter="url(#cg)"/>
      <text x="528" y="82" fill="#d9e9ff">TS</text>
      <rect x="464" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="464;580;464" dur="3.6s" begin="-0.3s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.2s" begin="-0.3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="606" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#56d364" stroke-width="1.5" filter="url(#cg)"/>
      <text x="672" y="82" fill="#d6ffe0">PYTHON</text>
      <rect x="608" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="608;724;608" dur="3.1s" begin="-0.9s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="750" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#6ea8fe" stroke-width="1.5" filter="url(#cg)"/>
      <text x="816" y="82" fill="#dce8ff">C++</text>
      <rect x="752" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="752;868;752" dur="3.3s" begin="-1.5s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.4s" begin="-1.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="894" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#f4a259" stroke-width="1.5" filter="url(#cg)"/>
      <text x="960" y="82" fill="#ffe6cf">MySQL</text>
      <rect x="896" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="896;1012;896" dur="2.9s" begin="-0.4s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.9s" begin="-0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1038" y="45" width="132" height="60" rx="12" fill="#0b1124" stroke="#f06262" stroke-width="1.5" filter="url(#cg)"/>
      <text x="1104" y="82" fill="#ffd9d9">GIT</text>
      <rect x="1040" y="45" width="16" height="60" rx="4" fill="#ffffff" opacity="0.10"><animate attributeName="x" values="1040;1156;1040" dur="3.5s" begin="-1.1s" repeatCount="indefinite"/></rect>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.1s" begin="-1.1s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
